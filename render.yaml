# ============================================================
# AI Career Intelligence — Render.com Blueprint
# Deploys: PostgreSQL + FastAPI Backend + Next.js Frontend
# ============================================================

services:
  # ============================================================
  # Backend: FastAPI (Python)
  # URL: https://ai-career-backend-codr.onrender.com
  # ============================================================
  - type: web
    name: ai-career-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: "AI Career Intelligence"
      - key: API_HOST
        value: "0.0.0.0"
      - key: API_PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Render provides DATABASE_URL as postgres:// — session.py rewrites to asyncpg
      - key: DATABASE_URL
        fromDatabase:
          name: ai-career-db
          property: connectionString
      - key: DATABASE_ECHO
        value: "false"
      # Redis: disabled on free tier (optional caching)
      - key: REDIS_URL
        value: ""
      # ChromaDB: use local persistent directory on free tier
      - key: CHROMA_HOST
        value: "localhost"
      - key: CHROMA_PORT
        value: "8001"
      - key: CHROMA_PERSIST_DIR
        value: "/app/data/chromadb"
      - key: UPLOAD_DIR
        value: "/app/data/uploads"
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      # Set your actual Gemini API key in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: HF_EMBEDDING_MODEL
        value: "sentence-transformers/all-MiniLM-L6-v2"
      # CORS: Include both the deployed frontend and local dev
      - key: CORS_ORIGINS
        value: '["https://ai-career-intelligence-frontend.onrender.com","http://localhost:3000","http://127.0.0.1:3000"]'
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true

  # ============================================================
  # Frontend: Next.js Static Export
  # URL: https://ai-career-intelligence-frontend.onrender.com
  # Built as static export (output: export) and served as a static site
  # Build command: npm ci && OUTPUT_MODE=export npm run build
  # Publish directory: frontend/out
  # ============================================================
  - type: web
    name: ai-career-intelligence-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm ci && OUTPUT_MODE=export npm run build"
    staticPublishPath: out
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://ai-career-backend-codr.onrender.com/api/v1"
      - key: OUTPUT_MODE
        value: "export"
      - key: NODE_ENV
        value: production

databases:
  - name: ai-career-db
    plan: free
    region: oregon
    databaseName: ai_career_db
    user: career_user
